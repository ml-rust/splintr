# cargo-deny configuration.
#
# Run locally: `cargo deny --exclude-dev check`
# CI gate:     .github/workflows/test.yml :: audit job

[graph]
# Every target splintr is built for. A vulnerable Windows-only dependency that
# never appears on Linux still ships to users through the Windows wheel.
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "aarch64-unknown-linux-gnu" },
    { triple = "x86_64-pc-windows-msvc" },
    { triple = "aarch64-apple-darwin" },
    { triple = "x86_64-apple-darwin" },
    { triple = "wasm32-unknown-unknown" },
    { triple = "wasm32-wasip1" },
]
# The optional features are part of the shipped surface — the wheels are built
# with `python,pcre2` — so their dependency trees must be audited too.
all-features = true

# ────────────────────────────────────────────────────────────────────────
# Security advisories. A tokenizer parses untrusted text and untrusted
# vocabulary files, so any RustSec advisory against a dependency (direct or
# transitive) fails CI.
[advisories]
version = 2
yanked = "deny"
# Empty, and kept that way: the `RUSTSEC-2026-0173` entry that used to sit here
# covered proc-macro-error2, which `dynasm` no longer pulls in — cargo-deny
# reports an ignore that matches nothing, so a stale entry cannot rot quietly.
ignore = []

# ────────────────────────────────────────────────────────────────────────
# Licenses — allow-list. Anything not on this list fails CI. splintr ships
# under MIT, and a consumer vendoring it inherits this whole tree.
[licenses]
version = 2
#
# The list is exactly what the current tree uses, not every license we would
# accept: an allowance nobody has reviewed is an allowance nobody is watching.
# A dependency arriving under some other permissive license fails this gate and
# is added here deliberately, in the PR that introduces it.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0", # weak-copyleft at file level; fine for libraries we link
    # The bundled vocabularies carry their model's licence, and four of those
    # are vendor terms with no SPDX identifier. Each reaches a consumer only
    # through the opt-in `vocab-*` feature that pulls its crate in, and each
    # carries restrictions an MIT/Apache tree does not — so they are named
    # individually here rather than waved through.
    "LicenseRef-Gemma-Terms-of-Use",  # use restrictions, Gemma 2 and 3
    "LicenseRef-Llama-2-Community",   # use restrictions + 700M MAU clause
    "LicenseRef-Llama-3.1-Community", # as above, Llama 3.1's own text
    "LicenseRef-Kimi-Modified-MIT",   # MIT plus a display-attribution clause
]
confidence-threshold = 0.93

# Crates whose licence has no SPDX identifier, so cargo-deny cannot read one
# off the file. Each is pinned to the exact file it was reviewed against: change
# the LICENSE and the hash stops matching, which is the point.
#
# Gemma 4 is absent deliberately — it is Apache-2.0 and declares it in
# `license`, so nothing here has to speak for it.

[[licenses.clarify]]
crate = "splintr-vocab-gemma2"
expression = "LicenseRef-Gemma-Terms-of-Use"
license-files = [{ path = "LICENSE", hash = 0x69a2b43e }]

[[licenses.clarify]]
crate = "splintr-vocab-gemma3"
expression = "LicenseRef-Gemma-Terms-of-Use"
license-files = [{ path = "LICENSE", hash = 0x69a2b43e }]

[[licenses.clarify]]
crate = "splintr-vocab-llama2"
expression = "LicenseRef-Llama-2-Community"
license-files = [{ path = "LICENSE", hash = 0x96b4d1c8 }]

[[licenses.clarify]]
crate = "splintr-vocab-llama3"
expression = "LicenseRef-Llama-3.1-Community"
license-files = [{ path = "LICENSE", hash = 0xbb3fc207 }]

# Not plain MIT, and not claimed as such: Moonshot's text adds a requirement to
# display "Kimi K2" in any product above 100M monthly active users or $20M
# monthly revenue. cargo-deny reads it as MIT at 0.84 confidence, under this
# file's 0.93 threshold — correctly, because it is not MIT.
[[licenses.clarify]]
crate = "splintr-vocab-kimi"
expression = "LicenseRef-Kimi-Modified-MIT"
license-files = [{ path = "LICENSE", hash = 0x9285d303 }]

# ────────────────────────────────────────────────────────────────────────
[bans]
multiple-versions = "warn" # warn (not deny) — common in transitive trees
wildcards = "deny"         # no `foo = "*"` deps in our Cargo.toml
highlight = "all"
deny = []
skip-tree = []

# ────────────────────────────────────────────────────────────────────────
# Where dependencies may come from. crates.io only — a git-pinned dependency
# would make the published crate unbuildable for consumers.
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
