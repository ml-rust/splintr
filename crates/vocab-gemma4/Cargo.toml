[package]
name = "splintr-vocab-gemma4"
version = "1.0.0"
edition = "2021"
description = "Bundled tokenizer vocabulary for splintr: Gemma 4."
license = "Apache-2.0"
repository = "https://github.com/ml-rust/splintr"
homepage = "https://github.com/ml-rust/splintr"
readme = "README.md"
keywords = ["tokenizer", "bpe", "vocabulary", "splintr"]
categories = ["text-processing"]
# The `.mbpe` text and the build script that packs it. The two binary forms the
# loader reads are generated into `OUT_DIR`, never shipped.
#
# An `.mbpe` rather than the `.tiktoken` every other vocabulary crate ships:
# Gemma 4 needs its token ids and its merge order stated *separately*, which one
# rank per token cannot do (see `splintr-vocab-pack`).
include = [
    "/src/**/*.rs",
    "/build.rs",
    "/Cargo.toml",
    "/README.md",
    "/LICENSE",
    "/vocabs/gemma4.mbpe",
]

[dependencies]

[build-dependencies]
# `1.2` for `pack_mbpe_into_out_dir`, which earlier versions do not have.
splintr-vocab-pack = { path = "../vocab-pack", version = "1.2" }
