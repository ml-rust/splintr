# Reusable test workflow.
#
# Called by:
#   - ci.yml              (PR checks + manual)
#   - release-prepare.yml (tag gate, before anything is built for release)
#
# Not triggered directly — `workflow_call` only.
#
# Jobs:
#   lint      — rustfmt + clippy + rustdoc + doctests, plus the release-path
#               shell scripts (shellcheck + their self-test), so a broken
#               verifier fails a PR instead of a publish.
#   test      — `cargo nextest run` on Linux / macOS / Windows, default
#               features. The optional deps (pyo3, pcre2) are off here; the
#               jobs below cover them.
#   pcre2     — the same suite with the PCRE2 backend enabled. Nothing in the
#               default matrix compiles a single line of it, so without this
#               lane the alternative regex backend ships untested.
#   python    — builds the extension module and runs the pytest suite plus a
#               tiktoken parity check, the only place the PyO3 layer is
#               exercised end to end.
#   features  — `cargo check` for every feature combination that ships,
#               including the `--no-default-features` build the README offers.
#   wasm      — `cargo check` for wasm32-unknown-unknown and wasm32-wasip1
#               (`--no-default-features`: neither Rayon threads nor the regexr
#               JIT exist on those targets).
#   audit     — cargo-deny: advisories, licenses, sources.

name: Test

on:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  lint:
    name: Lint, Format & Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt, clippy

      # `--all-features` turns on `python`, and pyo3's build script needs an
      # interpreter to resolve the ABI it compiles against.
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: lint

      # Resolving through a local override rewrites Cargo.lock: a contributor's
      # gitignored `.cargo/config.toml` can carry a `[patch.crates-io]` entry
      # pointing regexr at a sibling checkout, and the patched crate then loses
      # its registry `source` and `checksum` and becomes a bare path entry. That
      # form is useless to anyone without the same directory layout, and
      # `--locked` builds and `cargo publish` reject it. Anything that runs
      # cargo can do it, including rust-analyzer in the background, so it lands
      # without anyone deciding to commit it.
      #
      # The workspace's own crates have no `source` either, legitimately — they
      # are path members, not registry ones. They are excluded by asking cargo
      # which crates those are rather than by naming them here: this check
      # listed only `splintr` until the vocabularies became fifteen crates of
      # their own, and a list written here goes stale the moment one is added.
      - name: Check Cargo.lock resolves against the registry
        run: |
          members=$(cargo metadata --format-version 1 --no-deps \
            | python3 -c 'import json,sys; print("\n".join(p["name"] for p in json.load(sys.stdin)["packages"]))')
          patched=$(awk '
            /^\[\[package\]\]/ { name=""; has_source=0; next }
            /^name = / { gsub(/"/, "", $3); name=$3; next }
            /^source = / { has_source=1; next }
            /^$/ { if (name != "" && !has_source) print name; name=""; next }
            END { if (name != "" && !has_source) print name }
          ' Cargo.lock | grep -vxF "$members" || true)
          if [ -n "$patched" ]; then
            echo "::error::Cargo.lock resolved through a local override: $patched"
            echo "Re-resolve against the registry:"
            echo "    mv .cargo/config.toml .cargo/config.toml.bak"
            echo "    cargo fetch"
            echo "    mv .cargo/config.toml.bak .cargo/config.toml"
            exit 1
          fi
          echo "Cargo.lock is clean"

      - name: Check formatting
        run: cargo fmt --all --check

      # The agent-token ids exist in four places — the Rust modules, the PyO3
      # classes, and the tables in docs/special_tokens.md — all emitted from one
      # table in this script. Regenerating must be a no-op, or one of the four
      # is stale and callers reading it get an id the tokenizer disagrees with.
      - name: Check generated agent tokens are current
        run: |
          python3 scripts/generate_agent_tokens.py --update-docs --check
          python3 scripts/generate_agent_tokens.py --lang rust \
            > /tmp/agent_tokens_generated.rs
          python3 scripts/generate_agent_tokens.py --lang python \
            > /tmp/agent_tokens_py.rs
          diff -u src/core/tokenizer/agent_tokens_generated.rs \
            /tmp/agent_tokens_generated.rs
          diff -u src/python/agent_tokens_generated.rs /tmp/agent_tokens_py.rs

      - name: Clippy (all targets, all features)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      # Warnings are denied because the failures that matter here are silent: a
      # link to a crate-private item renders as plain text rather than erroring,
      # so the published docs lose it and nothing reports why.
      - name: Build docs
        run: cargo doc --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

      # The README's Rust examples are doctests; this is what keeps them from
      # drifting away from the API they document.
      - name: Run doctests
        run: cargo test --doc

      - name: Shellcheck CI scripts
        run: shellcheck scripts/ci/*.sh

      - name: Release verifier self-test
        run: bash scripts/ci/test_release_verifiers.sh

  # ─────────────────────────────────────────────────────────────────────────
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: test-${{ matrix.os }}

      - name: Install cargo-nextest
        uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026 # v2.85.11
        with:
          tool: nextest

      - name: Run tests
        run: cargo nextest run --no-fail-fast

      - name: Upload nextest report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nextest-${{ matrix.os }}
          path: target/nextest/default/junit.xml
          if-no-files-found: ignore

  # ─────────────────────────────────────────────────────────────────────────
  # The PCRE2 backend is an optional feature, so the matrix above never builds
  # it. Linux-only and single-config on purpose: the backend is pure Rust glue
  # over a vendored C library with no platform-specific code of its own, and
  # the point of the lane is that its code paths run at all.
  pcre2:
    name: Test (PCRE2 backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: pcre2

      - name: Install cargo-nextest
        uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026 # v2.85.11
        with:
          tool: nextest

      - name: Run tests with the PCRE2 backend
        run: cargo nextest run --features pcre2 --no-fail-fast
        env:
          # JIT compilation is what makes the backend worth having; build it in
          # so the tested configuration is the shipped one.
          PCRE2_SYS_JIT: "1"

  # ─────────────────────────────────────────────────────────────────────────
  python:
    name: Python bindings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: python

      # The wheels ship `python,pcre2`; build the same combination here so the
      # tested module is the one users install.
      - name: Build the extension module
        run: |
          set -euo pipefail
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          pip install maturin pytest tiktoken
          maturin develop --release --features python,pcre2
        env:
          PCRE2_SYS_JIT: "1"

      - name: Run the Python test suite
        run: .venv/bin/python -m pytest python/tests -q

      # Differential, not self-consistent: the suite above fixes behaviour
      # splintr already knows about, this asserts it still matches tiktoken.
      - name: Check parity against tiktoken
        run: .venv/bin/python scripts/ci/check_tiktoken_parity.py

      # The fixture tests replay a fixed corpus; this generates fresh strings
      # from each vocabulary's own special tokens every run, which is where the
      # boundary bugs live. Only the bundled OpenAI vocabularies run here — the
      # rest of the fuzzer's targets need model directories no runner has. The
      # seed is fixed so a failure is reproducible from the log alone.
      - name: Fuzz against tiktoken
        run: |
          .venv/bin/python scripts/fuzz_reference.py cl100k_base o200k_base \
            --cases 2000 --seed 20260805

  # ─────────────────────────────────────────────────────────────────────────
  features:
    name: Feature matrix (${{ matrix.label }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - flags: ""
            label: default
          # The minimal build the README documents: no Rayon, no regexr
          # JIT/SIMD. Nothing else in CI compiles the sequential fallbacks.
          - flags: "--no-default-features"
            label: no-default-features
          - flags: "--no-default-features --features rayon"
            label: rayon only
          - flags: "--no-default-features --features regexr-jit"
            label: regexr-jit only
          - flags: "--features pcre2"
            label: pcre2
          - flags: "--all-features"
            label: all features
          # One bundled family on its own, which is the shape that proves the
          # `vocab-*` features still gate their data crate independently — the
          # combined `vocabs` and `--all-features` rows would both pass with
          # every family wired to every other.
          - flags: "--no-default-features --features vocab-cl100k"
            label: one vocabulary only
          # A family that ships no payload, enabled without the family whose
          # ranks it reads. `vocab-phi4` has to pull `vocab-cl100k` in itself;
          # if it ever stops doing so this is the only row that fails.
          - flags: "--no-default-features --features vocab-phi4"
            label: shared-payload vocabulary only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      # `--all-features` enables `python`; pyo3's build script needs an
      # interpreter present.
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: features

      - name: cargo check
        run: cargo check --lib --tests --examples ${{ matrix.flags }}

  # ─────────────────────────────────────────────────────────────────────────
  # Tokenization runs in the browser and in WASI runtimes; both are compile-only
  # here, since running them would need a wasm host we don't gate every PR on.
  wasm:
    name: WASM check (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [wasm32-unknown-unknown, wasm32-wasip1]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust + target
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: wasm-${{ matrix.target }}

      # Rayon's thread pool and the regexr JIT have no wasm implementation, so
      # this is the minimal build — the same one the README documents.
      - name: cargo check --lib
        run: cargo check --lib --no-default-features --target ${{ matrix.target }}

  # ─────────────────────────────────────────────────────────────────────────
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Install cargo-deny
        uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026 # v2.85.11
        with:
          tool: cargo-deny

      - name: Run cargo-deny
        run: cargo deny --exclude-dev check
