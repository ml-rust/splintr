# Tag gate for a releasable build. Pushing a v* tag validates the tag against
# `.version` and the CHANGELOG, runs the full test suite, and builds every wheel
# plus the sdist once. Nothing is published and nothing leaves the repo.
#
# The manual `Release` workflow then consumes THIS run's artifacts by run ID, so
# a failure in the publish or release stage is fixed and retried without
# repeating the tests or rebuilding a single wheel — and the bytes that reach
# PyPI are the bytes the test suite passed on.
#
# Artifacts are retained 14 days: that is the window in which a `Release` run
# can still resume from this prepare run.

name: Release Prepare
run-name: Release Prepare ${{ github.ref_name }}

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-prepare-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  validate-version:
    uses: ./.github/workflows/release-validate.yml
    with:
      ref: ${{ github.ref_name }}

  # Full lint + cross-platform test + python + features + wasm + audit gates.
  # Calls test.yml directly rather than ci.yml, whose PR-draft gate skips under
  # workflow_call.
  ci:
    name: CI Gate
    needs: validate-version
    uses: ./.github/workflows/test.yml

  # ── Wheels ────────────────────────────────────────────────────────────────
  # One wheel per platform family the README claims support for. A platform
  # dropped here silently stops receiving wheels, which is why
  # verify_release_artifacts.sh checks the same list from the other side.
  #
  # Every entry runs on a runner of its own architecture, never a cross-compile
  # from x86_64. maturin-action would happily build the aarch64 wheels from an
  # ubuntu-latest runner through `manylinux2014-cross:aarch64`, but an aarch64
  # wheel cannot be imported on an x86_64 host, so the smoke test below would
  # stop running for exactly the two platforms no job here has ever executed.
  # The arm runners are free and unlimited on public repositories; if that ever
  # changes, the replacement is QEMU under the same native-execution rule, not
  # a cross build with the smoke test dropped.
  #
  # The musl targets name a container explicitly through `manylinux:`; the glibc
  # and Windows/macOS ones take the runner's own default.
  build-wheels:
    name: Build wheels (${{ matrix.label }})
    needs: [validate-version, ci]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x86_64
            manylinux: auto
          - os: ubuntu-latest
            label: linux-x86_64-musl
            target: x86_64-unknown-linux-musl
            manylinux: musllinux_1_2
            smoke_image: python:3.12-alpine
          - os: ubuntu-24.04-arm
            label: linux-aarch64
            target: aarch64-unknown-linux-gnu
            manylinux: auto
          - os: ubuntu-24.04-arm
            label: linux-aarch64-musl
            target: aarch64-unknown-linux-musl
            manylinux: musllinux_1_2
            smoke_image: python:3.12-alpine
          - os: macos-15-intel
            label: macos-x86_64
            manylinux: auto
          - os: macos-latest
            label: macos-arm64
            manylinux: auto
          - os: windows-latest
            label: windows-x86_64
            manylinux: auto
          - os: windows-11-arm
            label: windows-arm64
            manylinux: auto
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Stamp version from tag
        shell: bash
        run: bash scripts/update_version.sh "${{ github.ref_name }}"

      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          # `python` for the PyO3 bindings, `pcre2` for the optional backend —
          # regexr (the default) is always compiled in. regexr's SIMD is chosen
          # at run time; its JIT and PCRE2's are build-time decisions, so they
          # have to be made here.
          #
          # `pcre2` is not negotiable per platform: `Tokenizer.pcre2()` is
          # public Python API, so a wheel missing the feature turns one method
          # into a platform-dependent error. The smoke test asserts it.
          args: --release --out dist --features python,pcre2
          sccache: "true"
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
        env:
          PCRE2_SYS_JIT: "1"

      - name: Smoke-test the wheel
        shell: bash
        run: bash scripts/ci/smoke_test_wheel.sh dist "${{ matrix.smoke_image }}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-${{ matrix.label }}
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 14

  # ── Source distribution ───────────────────────────────────────────────────
  build-sdist:
    name: Build sdist
    needs: [validate-version, ci]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Stamp version from tag
        run: bash scripts/update_version.sh "${{ github.ref_name }}"

      - name: Build sdist
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: sdist
          args: --out dist

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-sdist
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 14

  # ── crates.io dry run ─────────────────────────────────────────────────────
  # The crates publish from source, so the thing that can fail at release time
  # is packaging: an `include` list omitting the payload its `include_bytes!`
  # needs, or the packaged tree not building from a clean checkout. Both are
  # caught here, before anything is uploaded anywhere.
  #
  # `--workspace` covers splintr and all nine `splintr-vocab-*` crates, and is
  # what makes the first release possible at all: splintr depends on them by
  # version, so packaging it alone cannot resolve until they are on the
  # registry, while packaging them together lets each resolve against the
  # sibling being packaged beside it.
  package-crate:
    name: Package crate (dry run)
    needs: [validate-version, ci]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: package

      - name: Stamp version from tag
        run: bash scripts/update_version.sh "${{ github.ref_name }}"

      - name: cargo package
        run: cargo package --workspace --allow-dirty

  # ── Instructions ──────────────────────────────────────────────────────────
  summary:
    name: Release instructions
    needs: [validate-version, build-wheels, build-sdist, package-crate]
    runs-on: ubuntu-latest
    steps:
      - name: Write summary
        env:
          VERSION: ${{ needs.validate-version.outputs.cargo_version }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          TAG: ${{ github.ref_name }}
        run: |
          {
            echo "## Prepared ${TAG}"
            echo
            echo "Tests passed, wheels and sdist are built, and the crate packages cleanly. Publish with:"
            echo
            echo '```sh'
            echo "gh workflow run release.yml -R ${REPO} \\"
            echo "  -f tag=${TAG} \\"
            echo "  -f prepare_run_id=${RUN_ID}"
            echo '```'
            echo
            echo "If one stage fails, re-run the same command with only the"
            echo "remaining stages enabled (e.g. \`-f publish_crate=false\`)."
            echo "Nothing is rebuilt."
          } >> "$GITHUB_STEP_SUMMARY"
