# CI — thin wrapper that calls the reusable test workflow.
#
# Runs on every pull request and can be dispatched manually. Release Prepare
# calls test.yml directly rather than this workflow. The draft gate below
# skips draft pull requests only and passes under `workflow_call`.

name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: Test Suite
    uses: ./.github/workflows/test.yml
