# Manual distribution workflow. Push a v* tag first; `Release Prepare` runs the
# test suite and builds the wheels and sdist. Then run this workflow with that
# tag and the successful prepare run ID.
#
# PyPI and the GitHub Release consume the prepare run's artifacts, so a failed
# stage is retried by re-dispatching with only that stage enabled — nothing is
# recompiled, and the bytes that reach PyPI stay the ones the suite passed on.
#
# Stages:
#   publish_crate   -> crates.io (verifying publish, skipped if already indexed)
#   publish_pypi    -> PyPI via trusted publishing (skips already-uploaded files)
#   github_release  -> GitHub Release with the wheels and sdist attached
#
# Each stage is idempotent: an already-published version is skipped, the release
# is overwritten in place. Re-running is safe.
#
# Required secret: CARGO_REGISTRY_TOKEN. PyPI uses trusted publishing (OIDC),
# so it needs no token.

name: Release
run-name: Release ${{ inputs.tag }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, e.g. v0.11.0"
        required: true
        type: string
      prepare_run_id:
        description: "Successful Release Prepare run ID holding the wheels"
        required: true
        type: string
      publish_crate:
        description: "Publish splintr to crates.io"
        type: boolean
        default: true
      publish_pypi:
        description: "Publish splintr-rs to PyPI"
        type: boolean
        default: true
      github_release:
        description: "Create the GitHub Release"
        type: boolean
        default: true

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Always runs. Cheap, and it guarantees the dispatched tag still means what
  # the prepare run assumed it meant.
  validate-version:
    uses: ./.github/workflows/release-validate.yml
    with:
      ref: ${{ inputs.tag }}

  # ── crates.io ─────────────────────────────────────────────────────────────
  # splintr is a single leaf crate — no publish-order tiers. A verifying publish
  # (no --no-verify) is the strongest guarantee the uploaded tarball builds from
  # a clean checkout, and it is the only thing that proves the explicit
  # `include` list in Cargo.toml carried every vocabulary `include_bytes!` needs.
  #
  # PREREQUISITE: `regexr` 0.1.5, the version Cargo.toml requires, must already
  # be on crates.io. It is resolved locally only through a gitignored
  # `.cargo/config.toml` `[patch.crates-io]` entry pointing at a sibling
  # checkout — the committed Cargo.lock carries no source or checksum for it —
  # so on a clean runner nothing resolves until regexr 0.1.5 is released.
  # Publish regexr first; that gates this stage, the wheel builds in Release
  # Prepare, and CI generally.
  publish-crate:
    name: Publish to crates.io
    needs: validate-version
    if: inputs.publish_crate
    runs-on: ubuntu-latest
    environment: crates.io
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Stamp version from tag
        run: bash scripts/update_version.sh "${{ inputs.tag }}"

      - name: Publish splintr
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          VERSION: ${{ needs.validate-version.outputs.cargo_version }}
        run: |
          set -euo pipefail

          is_published() {
            curl -sf \
              -H "User-Agent: splintr-ci (github.com/ml-rust/splintr)" \
              "https://crates.io/api/v1/crates/splintr/$1" > /dev/null 2>&1
          }

          if is_published "$VERSION"; then
            echo "splintr@$VERSION already published — skipping"
            exit 0
          fi

          echo "Publishing splintr@$VERSION..."
          # --allow-dirty: the version stamp edited the tracked manifests; the
          # verifying publish still runs.
          cargo publish --allow-dirty

  # ── PyPI ──────────────────────────────────────────────────────────────────
  # Trusted publishing: no API token, the runner proves its identity to PyPI
  # over OIDC. Independent of the crates.io stage — a registry outage on one
  # side must not block the other.
  publish-pypi:
    name: Publish to PyPI
    needs: validate-version
    if: inputs.publish_pypi
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/splintr-rs
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      # Runs before the download so a wrong, unfinished, or foreign run is
      # rejected without its wheels ever reaching the runner — these bytes go
      # to PyPI unmodified.
      - name: Verify prepare run
        env:
          GH_TOKEN: ${{ github.token }}
          PREPARE_RUN_ID: ${{ inputs.prepare_run_id }}
        run: |
          set -euo pipefail
          [[ "$PREPARE_RUN_ID" =~ ^[0-9]+$ ]] || {
            echo "::error::prepare_run_id must be numeric"
            exit 1
          }
          gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${PREPARE_RUN_ID}" \
            >"$RUNNER_TEMP/prepare-run.json"
          bash scripts/ci/verify_prepare_run.sh \
            "$RUNNER_TEMP/prepare-run.json" \
            "$(git rev-parse HEAD)"

      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "wheels-*"
          run-id: ${{ inputs.prepare_run_id }}
          github-token: ${{ github.token }}
          path: ./dist
          merge-multiple: true

      - name: Verify distributions
        env:
          PYPI_VERSION: ${{ needs.validate-version.outputs.pypi_version }}
        run: bash scripts/ci/verify_release_artifacts.sh ./dist "$PYPI_VERSION"

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist
          # Makes a re-dispatch after a partial upload safe: a file already on
          # PyPI is left alone instead of failing the run.
          skip-existing: true
          print-hash: true

  # ── GitHub Release ────────────────────────────────────────────────────────
  github-release:
    name: Create GitHub Release
    needs: validate-version
    if: inputs.github_release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Verify prepare run
        env:
          GH_TOKEN: ${{ github.token }}
          PREPARE_RUN_ID: ${{ inputs.prepare_run_id }}
        run: |
          set -euo pipefail
          [[ "$PREPARE_RUN_ID" =~ ^[0-9]+$ ]] || {
            echo "::error::prepare_run_id must be numeric"
            exit 1
          }
          gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${PREPARE_RUN_ID}" \
            >"$RUNNER_TEMP/prepare-run.json"
          bash scripts/ci/verify_prepare_run.sh \
            "$RUNNER_TEMP/prepare-run.json" \
            "$(git rev-parse HEAD)"

      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "wheels-*"
          run-id: ${{ inputs.prepare_run_id }}
          github-token: ${{ github.token }}
          path: ./dist
          merge-multiple: true

      - name: Verify distributions
        env:
          PYPI_VERSION: ${{ needs.validate-version.outputs.pypi_version }}
        run: bash scripts/ci/verify_release_artifacts.sh ./dist "$PYPI_VERSION"

      # The changelog is the release notes. Auto-generated notes list commit
      # subjects, which describe what was done to the code; the changelog
      # describes what changed for the person upgrading. `validate-version` has
      # already proved this section exists and is non-empty.
      - name: Build release notes from the changelog
        env:
          TAG: ${{ inputs.tag }}
          BASE: ${{ needs.validate-version.outputs.base_version }}
        run: |
          set -euo pipefail

          # Diff from the last tag of an earlier version line: this release's own
          # prereleases are not what the reader was running.
          BASE_ESCAPED="${BASE//./\\.}"
          PREVIOUS_TAG=$(
            git -c versionsort.suffix=-alpha \
                -c versionsort.suffix=-beta \
                -c versionsort.suffix=-rc \
                tag -l --sort=-v:refname 'v*' \
              | grep -vE "^v${BASE_ESCAPED}(-|$)" \
              | head -n 1 || true
          )

          bash scripts/ci/changelog_section.sh "$BASE" /tmp/changelog-section.md

          {
            cat /tmp/changelog-section.md
            echo
            if [[ -n "$PREVIOUS_TAG" ]]; then
              echo "**Full diff:** https://github.com/ml-rust/splintr/compare/${PREVIOUS_TAG}...${TAG}"
            else
              echo "**Tree:** https://github.com/ml-rust/splintr/tree/${TAG}"
            fi
          } > /tmp/release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ inputs.tag }}
          name: splintr ${{ needs.validate-version.outputs.cargo_version }}
          body_path: /tmp/release-notes.md
          draft: false
          prerelease: ${{ needs.validate-version.outputs.is_full_release != 'true' }}
          files: dist/*
          fail_on_unmatched_files: true
