name: perf

# What each run is called in the Actions list. Every run was previously just
# "perf", so a list of them said nothing about what was measured.
#
# `splintr: local` builds the checkout, and what identifies that build is the
# ref it was dispatched from — a tag gives "perf v0.15.0", a branch gives
# "perf main". Any other value is an explicit version, so it names itself:
# "perf 0.14.4". A baseline is appended, since a two-version run is a
# comparison and the pair is the point: "perf v0.15.0 vs 0.14.4".
#
# A branch name alone does not say which commit was measured, so the SHA is in
# the name too. It is the full 40 characters because workflow expressions have
# no substring function — there is no way to shorten it here, and a run you
# cannot trace to a commit is worth less than an ugly one. `git log --oneline`
# and the GitHub UI both accept a prefix of it.
#
# A tag run reads "perf v0.15.0 <sha>", a branch run "perf main <sha>", and an
# explicit version names itself: "perf 0.14.4 <sha>".
run-name: >-
  perf ${{ inputs.splintr == 'local' && github.ref_name || inputs.splintr }}${{
  inputs.splintr_baseline && format(' vs {0}', inputs.splintr_baseline) || '' }}
  ${{ github.sha }}

# splintr against the libraries it would replace, and against itself across
# versions. Manual only — it is a decision tool and a regression check, not
# something to run on every push.
#
# Suites are grouped by **how the vocabulary is loaded**, so every row compares
# the same input through the same kind of entry point — apples to apples:
#
#   *-ranks   every engine reads the SAME `.tiktoken` rank file plus that
#             vocabulary's pre-tokenizer expression. This is the path
#             `gigatoken` is fastest on and the only form `tiktoken` reads, so
#             it is the only way to have all three in one row.
#             splintr `Tokenizer(path, pattern)` · tiktoken `Encoding(ranks,
#             pat_str)` · gigatoken `from_tiktoken(path, scheme)`
#
#   *-json    every engine reads the SAME HuggingFace `tokenizer.json`.
#             `tiktoken` cannot appear here: it has no JSON loader at all.
#             splintr `from_json` · HuggingFace `tokenizers` · gigatoken
#             `from_json`
#
# A vocabulary appears in a family only where every engine in it can genuinely
# load that form. Kimi has no `tokenizer.json` published at all, so it is
# ranks-only; GLM has no named gigatoken rank scheme, so it is json-only.
#
# Batch is reported on two axes for the same reason. The *list* axis has every
# engine return `list[list[int]]`; the *flat* axis is only for the engines that
# can return ids as one contiguous buffer (splintr `encode_batch_flat`,
# gigatoken `encode_batch`), and the others are absent from it rather than
# charged for object construction their rival skipped.
#
# Every version input defaults to `latest`, i.e. whatever pip resolves today.
# Pin one only to answer a specific question — a regression check sets
# `splintr_baseline` to the previous release and leaves the rest alone.
#
# `splintr: local` builds the checked-out tree instead of installing a release,
# which is what makes this usable on a branch: without it the workflow can only
# ever measure what is already on PyPI, so a change cannot be validated until
# after it ships.

on:
  workflow_dispatch:
    inputs:
      splintr:
        description: "splintr-rs version, 'latest', or 'local' to build this checkout"
        default: "local"
        type: string
      splintr_baseline:
        description: "second splintr-rs version to compare against, or empty to skip"
        default: ""
        type: string
      tokenizers:
        description: "HuggingFace tokenizers version, or 'latest'"
        default: "latest"
        type: string
      tiktoken:
        description: "tiktoken version, or 'latest'"
        default: "latest"
        type: string
      gigatoken:
        description: "gigatoken version, 'latest', or empty to skip"
        default: "latest"
        type: string
      rounds:
        description: "interleaved rounds"
        default: "3"
        type: string

jobs:
  # One job per OS, running both suites. They were two jobs — python and rust,
  # each over the same two runners — which meant four checkouts and four builds
  # of splintr for two machines' worth of results. Sharing the runner also lets
  # the Rust harness and the wheel reuse one `target/`.
  #
  # The two suites answer different questions and stay separate *reports*: the
  # Python one measures what a Python caller gets, where most of a batch call is
  # CPython building lists (hence the flat axis); the Rust one measures the
  # kernels with no FFI in the way. They must never be read as one table.
  bench:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      SPLINTR: ${{ inputs.splintr }}
      SPLINTR_BASELINE: ${{ inputs.splintr_baseline }}
      TOKENIZERS: ${{ inputs.tokenizers }}
      TIKTOKEN: ${{ inputs.tiktoken }}
      GIGATOKEN: ${{ inputs.gigatoken }}
      ROUNDS: ${{ inputs.rounds }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Describe the machine
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            cpu=$(sysctl -n machdep.cpu.brand_string); cores=$(sysctl -n hw.ncpu)
          else
            cpu=$(lscpu | sed -n 's/^Model name: *//p' | head -1); cores=$(nproc)
          fi
          echo "HW=$cpu, ${cores} cores, $(python -c 'import platform;print(platform.platform())')" \
            >> "$GITHUB_ENV"

      - name: Fetch vocabularies
        run: |
          curl -sSfL -o qwen3.json \
            https://huggingface.co/Qwen/Qwen3-8B/resolve/main/tokenizer.json
          curl -sSfL -o glm4.json \
            https://huggingface.co/zai-org/GLM-4.5/resolve/main/tokenizer.json
          # The rank-file family reads the vocabularies splintr bundles, so the
          # bytes under all three engines are provably the ones it ships.
          for f in cl100k:cl100k_base o200k:o200k_base qwen3:qwen3 kimi:kimi; do
            cp "vocabs/${f#*:}.tiktoken" "${f%%:*}.tiktoken"
          done
          # The OpenAI vocabularies as `tokenizer.json`, so every engine can load
          # the same file. `tiktoken` keeps its own loader in its own suites; it
          # has no way to read one of these.
          curl -sSfL -o cl100k.json \
            https://huggingface.co/Xenova/gpt-4/resolve/main/tokenizer.json
          curl -sSfL -o o200k.json \
            https://huggingface.co/Xenova/gpt-4o/resolve/main/tokenizer.json

      - name: Fetch a prose corpus for the Rust suite
        run: |
          # Real prose, not repeated seed sentences: splintr keeps an LRU chunk
          # cache, and a corpus built by repetition would measure the cache
          # rather than the tokenizer. The vocabularies are already in place
          # from the step above.
          pip -q install pyarrow
          curl -sSfL -o wikitext.parquet \
            https://huggingface.co/datasets/Salesforce/wikitext/resolve/main/wikitext-103-raw-v1/train-00000-of-00002.parquet
          python .github/scripts/build_corpus.py wikitext.parquet corpus.txt "${CORPUS_MB:-120}"

      - name: Benchmark (Rust)
        run: |
          # This suite always builds the checkout — `.github/rust-bench` depends
          # on splintr by path — regardless of the `splintr` input, which only
          # selects what the *Python* suite installs. With anything but `local`
          # the two suites therefore measure different splintr versions, and a
          # reader comparing them would otherwise have no way to know.
          if [ "$SPLINTR" = "local" ]; then
            echo "RUST_PROVENANCE=splintr built from this checkout (${GITHUB_SHA:0:7}), the same build the Python suite measures." >> "$GITHUB_ENV"
          else
            echo "RUST_PROVENANCE=**splintr built from this checkout (${GITHUB_SHA:0:7}). The Python suite measured splintr-rs $SPLINTR from PyPI instead, so the two reports are NOT the same build.**" >> "$GITHUB_ENV"
          fi
          cd .github/rust-bench && cargo build --release && cd -
          BIN=.github/rust-bench/target/release/rust-bench
          # `-` says the vocabulary publishes no `tokenizer.json` — true of
          # Kimi. The harness then records that once, instead of three json
          # engines each reporting a fake I/O error, which reads like a failure.
          for v in cl100k o200k qwen3; do
            "$BIN" "$v" "$v.tiktoken" "$v.json" corpus.txt >> rust.jsonl
          done
          "$BIN" kimi kimi.tiktoken - corpus.txt >> rust.jsonl

      - name: Report (Rust)
        run: |
          python .github/scripts/rust_report.py \
            --title "splintr in Rust — ${{ matrix.os }} — ${GITHUB_SHA:0:7}" \
            --note "$HW" \
            --note "$(cd .github/rust-bench && cargo tree --depth 1 2>/dev/null | sed -n 's/^[^ ]* //p' | sed 's/^/    /')" \
            --note "Each family sizes its corpus from its slowest engine, so every engine in a table sees the same input." \
            --note "$RUST_PROVENANCE" \
            < rust.jsonl | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: perf-rust-${{ matrix.os }}
          path: rust.jsonl

      - name: Install each library in its own venv
        run: |
          # `latest` means no pin at all, so pip resolves what is current today.
          spec() { [ "$2" = "latest" ] && echo "$1" || echo "$1==$2"; }

          python -m venv venv-splintr
          if [ "$SPLINTR" = "local" ]; then
            # Build the checkout rather than install a release, so a branch can
            # be measured before it ships. The wheel is installed from a local
            # directory with the index disabled, so nothing can silently resolve
            # a PyPI build instead of the one just compiled.
            ./venv-splintr/bin/pip -q install maturin
            ./venv-splintr/bin/maturin build --release --out dist
            ./venv-splintr/bin/pip -q install --no-index --find-links dist splintr-rs
          else
            ./venv-splintr/bin/pip -q install "$(spec splintr-rs "$SPLINTR")"
          fi
          python -m venv venv-tokenizers
          ./venv-tokenizers/bin/pip -q install "$(spec tokenizers "$TOKENIZERS")"
          python -m venv venv-tiktoken
          ./venv-tiktoken/bin/pip -q install "$(spec tiktoken "$TIKTOKEN")"
          if [ -n "$GIGATOKEN" ]; then
            python -m venv venv-gigatoken
            ./venv-gigatoken/bin/pip -q install "$(spec gigatoken "$GIGATOKEN")"
          fi
          if [ -n "$SPLINTR_BASELINE" ]; then
            python -m venv venv-baseline
            ./venv-baseline/bin/pip -q install "splintr-rs==$SPLINTR_BASELINE"
          fi

          {
            echo "VERSIONS<<EOF"
            # The splintr line carries its provenance inline. It used to be two
            # separate lines — a version, then "built from <sha>" further down —
            # which read like two different facts, and the version alone looks
            # exactly like a release even when it is a source build.
            for v in splintr tokenizers tiktoken gigatoken; do
              [ -d "venv-$v" ] || continue
              line=$("./venv-$v/bin/pip" list 2>/dev/null \
                | grep -Ei "^(splintr-rs|tokenizers|tiktoken|gigatoken) " | sed 's/  */ /g')
              if [ "$v" = splintr ]; then
                if [ "$SPLINTR" = "local" ]; then
                  line="$line (local build, ${GITHUB_SHA:0:7})"
                else
                  line="$line (published wheel from PyPI)"
                fi
              fi
              echo "$line"
            done
            if [ -n "$SPLINTR_BASELINE" ]; then echo "splintr-rs $SPLINTR_BASELINE (baseline)"; fi
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Check the engines agree before timing them
        run: |
          check() { "./venv-$1/bin/python" .github/scripts/perf_bench.py "$2" "$3" x "$4" --check > "ids-$5.json"; }

          # Native loaders, against tiktoken.
          # A wrong pattern in perf_bench's table does not fail parity — every
          # engine is handed the same string, so they agree with each other
          # while all three tokenize the wrong vocabulary. Check it against
          # splintr's own constants first.
          ./venv-splintr/bin/python .github/scripts/perf_bench.py --verify-patterns

          # Same rank file, three engines.
          for f in cl100k o200k qwen3 kimi; do
            check splintr    "$f-ranks" splintr    "ranks:$f.tiktoken" "s-$f-r"
            check tiktoken   "$f-ranks" tiktoken   "ranks:$f.tiktoken" "t-$f-r"
            if [ -n "$GIGATOKEN" ]; then
              check gigatoken "$f-ranks" gigatoken "ranks:$f.tiktoken" "g-$f-r"
            fi
          done

          # Same tokenizer.json, three engines.
          for f in cl100k o200k qwen3 glm4; do
            check splintr    "$f-json" splintr    "$f.json" "s-$f-j"
            check tokenizers "$f-json" tokenizers "$f.json" "h-$f-j"
            if [ -n "$GIGATOKEN" ]; then
              check gigatoken "$f-json" gigatoken "$f.json" "g-$f-j"
            fi
          done

          python - <<'PY' >> "$GITHUB_ENV"
          import json, os, sys
          def load(path):
              d = json.load(open(path))
              return d["ids"], d["batch_ids"]
          def same(a, b):
              return load(a) == load(b)
          giga = os.environ.get("GIGATOKEN")
          checks = {}
          for f in ("cl100k", "o200k", "qwen3", "kimi"):
              checks[f"{f}-ranks: splintr == tiktoken"] = same(f"ids-s-{f}-r.json", f"ids-t-{f}-r.json")
              if giga:
                  checks[f"{f}-ranks: splintr == gigatoken"] = same(f"ids-s-{f}-r.json", f"ids-g-{f}-r.json")
          for f in ("cl100k", "o200k", "qwen3", "glm4"):
              checks[f"{f}-json: splintr == tokenizers"] = same(f"ids-s-{f}-j.json", f"ids-h-{f}-j.json")
              if giga:
                  checks[f"{f}-json: splintr == gigatoken"] = same(f"ids-s-{f}-j.json", f"ids-g-{f}-j.json")
          # An engine that disagrees with itself invalidates its own row
          # before any cross-engine comparison is worth reading.
          #
          # `check()` wrote these as ids-<engine>-<vocabulary>-<loader>.json.
          # Spell that back out rather than printing the path: these lines sit
          # in the public run summary next to the cross-engine ones above, and
          # "ids-g-cl100k-j.json" names a temp file the reader never saw.
          import glob, re
          ENGINES = {"s": "splintr", "t": "tiktoken", "g": "gigatoken", "h": "tokenizers"}
          LOADERS = {"r": "ranks", "j": "json"}
          for path in sorted(glob.glob("ids-*.json")):
              ids, batch_ids = load(path)
              m = re.fullmatch(r"ids-(\w)-(.+)-(\w)\.json", path)
              if m and m[1] in ENGINES and m[3] in LOADERS:
                  label = f"{m[2]}-{LOADERS[m[3]]}: {ENGINES[m[1]]} batch == single"
              else:
                  # An unrecognised name still gets checked, just not renamed.
                  label = f"{path}: batch == single"
              checks[label] = ids == batch_ids
          print("PARITY<<EOF")
          for name, ok in checks.items():
              print(f"- {name}: {'yes' if ok else 'NO'}")
          print("EOF")
          # Timing engines that disagree is not a comparison.
          sys.exit(0 if all(checks.values()) else 1)
          PY

      - name: Benchmark (Python)
        run: |
          run() { "./venv-$1/bin/python" .github/scripts/perf_bench.py "$2" "$3" "$4" "$5" >> rounds.jsonl; }
          # Interleaved rather than engine-by-engine: a runner that slows down
          # partway through then penalises whichever engine happened to be last.
          for r in $(seq 1 "${ROUNDS:-3}"); do
            for f in cl100k o200k qwen3 kimi; do
              if [ -n "$SPLINTR_BASELINE" ]; then
                run baseline "$f-ranks" splintr "splintr $SPLINTR_BASELINE" "ranks:$f.tiktoken"
              fi
              run splintr  "$f-ranks" splintr  "splintr"  "ranks:$f.tiktoken"
              run tiktoken "$f-ranks" tiktoken "tiktoken" "ranks:$f.tiktoken"
              if [ -n "$GIGATOKEN" ]; then
                run gigatoken "$f-ranks" gigatoken "gigatoken" "ranks:$f.tiktoken"
              fi
            done

            for f in cl100k o200k qwen3 glm4; do
              if [ -n "$SPLINTR_BASELINE" ]; then
                run baseline "$f-json" splintr "splintr $SPLINTR_BASELINE" "$f.json"
              fi
              run splintr    "$f-json" splintr    "splintr"       "$f.json"
              run tokenizers "$f-json" tokenizers "HF tokenizers" "$f.json"
              if [ -n "$GIGATOKEN" ]; then
                run gigatoken "$f-json" gigatoken "gigatoken" "$f.json"
              fi
            done
          done

      - name: Report (Python)
        run: |
          python .github/scripts/perf_report.py \
            --title "splintr through the Python API — ${{ matrix.os }} — ${GITHUB_SHA:0:7}" \
            --note "$HW" \
            --note "$(printf '%s' "$VERSIONS" | sed 's/^/    /')" \
            --note "Output parity:"$'\n'"$PARITY" \
            --note "Medians of ${ROUNDS:-3} interleaved rounds. Lower is better for latency; the last column is how many times better the first engine is." \
            < rounds.jsonl | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: perf-${{ matrix.os }}
          path: rounds.jsonl
