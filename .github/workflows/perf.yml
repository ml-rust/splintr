name: perf

# What each run is called in the Actions list. Every run was previously just
# "perf", so a list of them said nothing about what was measured.
#
# `splintr: local` builds the checkout, and what identifies that build is the
# ref it was dispatched from — a tag gives "perf v0.15.0", a branch gives
# "perf main". An explicit version names itself with a matching `v`:
# "perf v0.14.4". A baseline is appended, since a two-version run is a
# comparison and the pair is the point: "perf v0.15.0 vs 0.14.4".
#
# `latest` stays the literal word. Run names are evaluated when the run is
# created, before any job exists to ask pip or cargo what `latest` resolves to,
# so there is nothing to substitute. The resolved version is in the run summary
# instead, on the splintr line of the versions block.
#
# A branch name alone does not say which commit was measured, so the SHA is in
# the name too. It is the full 40 characters because workflow expressions have
# no substring function — there is no way to shorten it here, and a run you
# cannot trace to a commit is worth less than an ugly one. `git log --oneline`
# and the GitHub UI both accept a prefix of it.
#
# A tag run reads "perf v0.15.0 <sha>", a branch run "perf main <sha>", and an
# explicit version "perf v0.14.4 <sha>".
run-name: >-
  perf ${{ inputs.splintr == 'local' && github.ref_name || (inputs.splintr ==
  'latest' && 'latest' || format('v{0}', inputs.splintr)) }}${{
  inputs.splintr_baseline && format(' vs {0}', inputs.splintr_baseline) || '' }}
  ${{ github.sha }}

# splintr against the libraries it would replace, and against itself across
# versions. Manual only — it is a decision tool and a regression check, not
# something to run on every push.
#
# **Which vocabularies are measured is `.github/perf-models.tsv`, not this
# file.** Adding a family is one line there; nothing here, in the Rust harness
# or in the Python harness needs to change. That file also explains the two
# loader families every row belongs to:
#
#   *-ranks   every engine reads the same `.tiktoken` rank file plus that
#             vocabulary's pre-tokenizer expression — the only form `tiktoken`
#             reads, so the only way to have it in a row.
#   *-json    every engine reads the same HuggingFace `tokenizer.json`.
#
# A vocabulary appears in a family only where it publishes that form, and an
# engine appears in a row only where it can load it; anything else is a `—`
# cell and a line in "could not load", never a slow result.
#
# Batch is reported on two axes for the same reason. The *list* axis has every
# engine return `list[list[int]]`; the *flat* axis is only for the engines that
# can return ids as one contiguous buffer (splintr `encode_batch_flat`,
# gigatoken `encode_batch`), and the others are absent from it rather than
# charged for object construction their rival skipped.
#
# Every version input defaults to `latest`, i.e. whatever pip resolves today.
# Pin one only to answer a specific question — a regression check sets
# `splintr_baseline` to the previous release and leaves the rest alone.
#
# `splintr: local` builds the checked-out tree instead of installing a release,
# which is what makes this usable on a branch: without it the workflow can only
# ever measure what is already on PyPI, so a change cannot be validated until
# after it ships.

on:
  workflow_dispatch:
    inputs:
      splintr:
        description: "splintr-rs version, 'latest', or 'local' to build this checkout"
        default: "local"
        type: string
      splintr_baseline:
        description: "second splintr-rs version to compare against, or empty to skip"
        default: ""
        type: string
      tokenizers:
        description: "HuggingFace tokenizers version, or 'latest'"
        default: "latest"
        type: string
      tiktoken:
        description: "tiktoken version, or 'latest'"
        default: "latest"
        type: string
      gigatoken:
        description: "gigatoken version, 'latest', or empty to skip"
        default: "latest"
        type: string
      rounds:
        description: "interleaved rounds"
        default: "3"
        type: string
      corpora:
        # One corpus reports one script's cost and hides every other. The same
        # scanner change measured -17% on English and -2.5% on Chinese, because
        # ASCII is skipped eight bytes at a time and Han one character at a
        # time; a run that only saw English would have called that a uniform
        # win. The default spans Latin prose, Han, Cyrillic, an Indic
        # abugida, source code and agent traces — the axes that actually move
        # the number. Any name under `fixtures/lang` or `fixtures/modalities`
        # in `hf-internal-testing/tokenizers-test-data` is valid.
        #
        # Four, not every script there is: the run costs a fixed amount per
        # corpus, and these four already span the axes that move the number —
        # ASCII skipped eight bytes at a time, Han a character at a time, an
        # abugida whose marks defeat both, and source code where punctuation
        # runs dominate. Add `rus_Cyrl`, `agentic_swe`, `math_latex` or any
        # other name when a change looks script-specific.
        description: "space-separated corpora for the Rust suite"
        default: "eng_Latn cmn_Hani hin_Deva code_mixed"
        type: string

jobs:
  # One job per OS, running both suites. They were two jobs — python and rust,
  # each over the same two runners — which meant four checkouts and four builds
  # of splintr for two machines' worth of results. Sharing the runner also lets
  # the Rust harness and the wheel reuse one `target/`.
  #
  # The two suites answer different questions and stay separate *reports*: the
  # Python one measures what a Python caller gets, where most of a batch call is
  # CPython building lists (hence the flat axis); the Rust one measures the
  # kernels with no FFI in the way. They must never be read as one table.
  bench:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      SPLINTR: ${{ inputs.splintr }}
      SPLINTR_BASELINE: ${{ inputs.splintr_baseline }}
      TOKENIZERS: ${{ inputs.tokenizers }}
      TIKTOKEN: ${{ inputs.tiktoken }}
      GIGATOKEN: ${{ inputs.gigatoken }}
      ROUNDS: ${{ inputs.rounds }}
      CORPORA: ${{ inputs.corpora }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Describe the machine
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            cpu=$(sysctl -n machdep.cpu.brand_string); cores=$(sysctl -n hw.ncpu)
          else
            cpu=$(lscpu | sed -n 's/^Model name: *//p' | head -1); cores=$(nproc)
          fi
          echo "HW=$cpu, ${cores} cores, $(python -c 'import platform;print(platform.platform())')" \
            >> "$GITHUB_ENV"

      - name: Fetch the vocabularies and corpora
        run: |
          # Every `tokenizer.json` in the manifest, and the rank files splintr
          # bundles — the rank family reads ours, so the bytes under every
          # engine are provably the ones it ships.
          python .github/scripts/perf_models.py fetch models
          mkdir -p ranks
          python .github/scripts/perf_models.py fields ranks \
            | grep -v '^-$' | while read -r r; do cp "vocabs/$r.tiktoken" "ranks/"; done
          python .github/scripts/build_corpus.py corpora $CORPORA
          echo "MODELS=$(ls models | wc -l | tr -d ' ') vocabularies, $(ls corpora | wc -l | tr -d ' ') corpora" >> "$GITHUB_ENV"

      - name: Benchmark (Rust)
        run: |
          # Both suites measure whatever the `splintr` input names. `local`
          # keeps `rust-bench`'s path dependency and builds the checkout, which
          # is what lets a branch be measured before it ships; any other value
          # is a release, so the path dependency is swapped for that version
          # from crates.io. Without the swap this suite would build HEAD while
          # the Python one installed a release, and the summary would present
          # two different builds as one result.
          if [ "$SPLINTR" = "local" ]; then
            echo "RUST_PROVENANCE=splintr built from this checkout (${GITHUB_SHA:0:7}), the same source the Python suite builds its wheel from." >> "$GITHUB_ENV"
          else
            REQ="$(python .github/scripts/pin_rust_bench.py "$SPLINTR")"
            echo "RUST_PROVENANCE=splintr \`$REQ\` from crates.io, the same release the Python suite installs from PyPI." >> "$GITHUB_ENV"
          fi
          cd .github/rust-bench && cargo build --release && cd -
          BIN=.github/rust-bench/target/release/rust-bench
          # One invocation per manifest row, every corpus in each. `-` says the
          # vocabulary publishes no rank file, or no `tokenizer.json`; the
          # harness records that once, instead of every engine in the absent
          # family reporting a fake I/O error, which reads like a failure.
          CORPUS_PATHS=$(for c in $CORPORA; do echo -n "corpora/$c.txt "; done)
          # One vocabulary must not cost the run every vocabulary after it.
          # `rust-bench` already demotes an engine that cannot load or that
          # panics into its own "could not load" row, so reaching here means
          # the harness itself died — and the honest report of that is one
          # named failure plus every other family's numbers, not an empty
          # summary. The step still fails at the end, so it cannot pass
          # unnoticed.
          python .github/scripts/perf_models.py fields name ranks pattern \
          | while IFS=$'\t' read -r name ranks pattern; do
              json="models/$name.json"
              [ -f "$json" ] || json="-"
              [ "$ranks" = "-" ] || ranks="ranks/$ranks.tiktoken"
              [ "$ranks" = "-" ] && [ "$json" = "-" ] && continue
              "$BIN" "$name" "$ranks" "$json" "$pattern" $CORPUS_PATHS >> "rust-$name.jsonl" \
                || echo "$name" >> rust-failed.txt
              # Only a complete document is folded in: a harness killed midway
              # leaves a truncated JSON object the report cannot parse.
              if [ -s "rust-$name.jsonl" ] && ! grep -q "^$name$" rust-failed.txt 2>/dev/null; then
                cat "rust-$name.jsonl" >> rust.jsonl
              fi
              rm -f "rust-$name.jsonl"
            done
          if [ -f rust-failed.txt ]; then
            echo "RUST_FAILED=$(paste -sd, rust-failed.txt)" >> "$GITHUB_ENV"
          fi

      - name: Report (Rust)
        run: |
          python .github/scripts/rust_report.py \
            --title "splintr in Rust — ${{ matrix.os }} — ${GITHUB_SHA:0:7}" \
            --note "$HW — $MODELS" \
            --note "$(cd .github/rust-bench && cargo tree --depth 1 2>/dev/null | sed -n 's/^[^ ]* //p' | sed 's/^/    /')" \
            --note "Each family sizes its corpus from its slowest engine, so every engine in a table sees the same input." \
            --note "$RUST_PROVENANCE" \
            ${RUST_FAILED:+--note "> **The harness died on these vocabularies and they are missing from every table below: $RUST_FAILED.** Every other vocabulary still ran."} \
            < rust.jsonl | tee -a "$GITHUB_STEP_SUMMARY"
          # Reported first, then failed — a crash must not be a green run.
          [ -z "$RUST_FAILED" ]

      - uses: actions/upload-artifact@v7
        with:
          name: perf-rust-${{ matrix.os }}
          path: rust.jsonl

      - name: Install each library in its own venv
        run: |
          # `latest` means no pin at all, so pip resolves what is current today.
          spec() { [ "$2" = "latest" ] && echo "$1" || echo "$1==$2"; }

          python -m venv venv-splintr
          if [ "$SPLINTR" = "local" ]; then
            # Build the checkout rather than install a release, so a branch can
            # be measured before it ships. The wheel is installed from a local
            # directory with the index disabled, so nothing can silently resolve
            # a PyPI build instead of the one just compiled.
            ./venv-splintr/bin/pip -q install maturin
            ./venv-splintr/bin/maturin build --release --out dist
            ./venv-splintr/bin/pip -q install --no-index --find-links dist splintr-rs
          else
            ./venv-splintr/bin/pip -q install "$(spec splintr-rs "$SPLINTR")"
          fi
          python -m venv venv-tokenizers
          ./venv-tokenizers/bin/pip -q install "$(spec tokenizers "$TOKENIZERS")"
          python -m venv venv-tiktoken
          ./venv-tiktoken/bin/pip -q install "$(spec tiktoken "$TIKTOKEN")"
          if [ -n "$GIGATOKEN" ]; then
            python -m venv venv-gigatoken
            ./venv-gigatoken/bin/pip -q install "$(spec gigatoken "$GIGATOKEN")"
          fi
          if [ -n "$SPLINTR_BASELINE" ]; then
            python -m venv venv-baseline
            ./venv-baseline/bin/pip -q install "splintr-rs==$SPLINTR_BASELINE"
          fi

          {
            echo "VERSIONS<<EOF"
            # The splintr line carries its provenance inline. It used to be two
            # separate lines — a version, then "built from <sha>" further down —
            # which read like two different facts, and the version alone looks
            # exactly like a release even when it is a source build.
            for v in splintr tokenizers tiktoken gigatoken; do
              [ -d "venv-$v" ] || continue
              line=$("./venv-$v/bin/pip" list 2>/dev/null \
                | grep -Ei "^(splintr-rs|tokenizers|tiktoken|gigatoken) " | sed 's/  */ /g')
              if [ "$v" = splintr ]; then
                if [ "$SPLINTR" = "local" ]; then
                  line="$line (local build, ${GITHUB_SHA:0:7})"
                else
                  line="$line (published wheel from PyPI)"
                fi
              fi
              echo "$line"
            done
            if [ -n "$SPLINTR_BASELINE" ]; then echo "splintr-rs $SPLINTR_BASELINE (baseline)"; fi
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Check the engines agree before timing them
        run: |
          mkdir -p ids
          # splintr must load everything in the manifest — a vocabulary it
          # cannot read is a bug in splintr, and the run should stop. A rival
          # that cannot is a fact about the rival: it is recorded and its row
          # is left out, exactly as the Rust suite does.
          # `<engine>__<vocabulary>__<family>`, which is what `perf_check.py`
          # groups on. The suite is `<vocabulary>-<family>` and a vocabulary may
          # itself contain a hyphen (`gpt-oss`), so the family is taken from the
          # last one and the name from everything before it.
          check() {
            tag="ids/$3__${2%-*}__${2##*-}"
            if "./venv-$1/bin/python" .github/scripts/perf_bench.py "$2" "$3" x "$4" \
                 --check > "$tag.json" 2> "$tag.err"; then
              rm -f "$tag.err"
            else
              rm -f "$tag.json"
              [ "$1" = splintr ] && { cat "$tag.err"; exit 1; }
              mv "$tag.err" "$tag.fail"
            fi
          }

          # A wrong pattern in perf_bench's table does not fail parity — every
          # engine is handed the same string, so they agree with each other
          # while all three tokenize the wrong vocabulary. Check it against
          # splintr's own constants first.
          ./venv-splintr/bin/python .github/scripts/perf_bench.py --verify-patterns

          python .github/scripts/perf_models.py fields name ranks json giga \
          | while IFS=$'\t' read -r name ranks json giga; do
              if [ "$ranks" != "-" ]; then
                check splintr  "$name-ranks" splintr  "ranks:ranks/$ranks.tiktoken"
                check tiktoken "$name-ranks" tiktoken "ranks:ranks/$ranks.tiktoken"
                if [ -n "$GIGATOKEN" ] && [ "$giga" != "-" ]; then
                  check gigatoken "$name-ranks" gigatoken "ranks:ranks/$ranks.tiktoken"
                fi
              fi
              if [ -f "models/$name.json" ]; then
                check splintr    "$name-json" splintr    "models/$name.json"
                check tokenizers "$name-json" tokenizers "models/$name.json"
                if [ -n "$GIGATOKEN" ]; then
                  check gigatoken "$name-json" gigatoken "models/$name.json"
                fi
              fi
            done

          # Timing engines that disagree is not a comparison.
          python .github/scripts/perf_check.py ids

      - name: Benchmark (Python)
        run: |
          # A rival that failed the load check above has no ids file, so it is
          # not timed either — the report shows `—` for it rather than a
          # number nobody can reproduce.
          ran() { [ -f "ids/$1__${2%-*}__${2##*-}.json" ]; }
          run() {
            ran "$3" "$2" || return 0
            "./venv-$1/bin/python" .github/scripts/perf_bench.py "$2" "$3" "$4" "$5" >> rounds.jsonl
          }
          # Interleaved rather than engine-by-engine: a runner that slows down
          # partway through then penalises whichever engine happened to be last.
          for r in $(seq 1 "${ROUNDS:-3}"); do
            python .github/scripts/perf_models.py fields name ranks json giga \
            | while IFS=$'\t' read -r name ranks json giga; do
                if [ "$ranks" != "-" ]; then
                  spec="ranks:ranks/$ranks.tiktoken"
                  if [ -n "$SPLINTR_BASELINE" ]; then
                    run baseline "$name-ranks" splintr "splintr $SPLINTR_BASELINE" "$spec"
                  fi
                  run splintr  "$name-ranks" splintr  "splintr"  "$spec"
                  run tiktoken "$name-ranks" tiktoken "tiktoken" "$spec"
                  if [ -n "$GIGATOKEN" ] && [ "$giga" != "-" ]; then
                    run gigatoken "$name-ranks" gigatoken "gigatoken" "$spec"
                  fi
                fi
                if [ -f "models/$name.json" ]; then
                  spec="models/$name.json"
                  if [ -n "$SPLINTR_BASELINE" ]; then
                    run baseline "$name-json" splintr "splintr $SPLINTR_BASELINE" "$spec"
                  fi
                  run splintr    "$name-json" splintr    "splintr"       "$spec"
                  run tokenizers "$name-json" tokenizers "HF tokenizers" "$spec"
                  if [ -n "$GIGATOKEN" ]; then
                    run gigatoken "$name-json" gigatoken "gigatoken" "$spec"
                  fi
                fi
              done
          done

      - name: Report (Python)
        run: |
          python .github/scripts/perf_report.py \
            --title "splintr through the Python API — ${{ matrix.os }} — ${GITHUB_SHA:0:7}" \
            --note "$HW — $MODELS" \
            --note "$(printf '%s' "$VERSIONS" | sed 's/^/    /')" \
            --note "Output parity: $PARITY" \
            --note "Medians of ${ROUNDS:-3} interleaved rounds. Lower is better for latency; the last column is how many times better the first engine is." \
            < rounds.jsonl | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: perf-${{ matrix.os }}
          path: rounds.jsonl
