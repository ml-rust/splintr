# splintr against the other Rust tokenizer crates, with no Python in the loop.
#
# Deliberately outside the splintr package, exactly as the Python harness in
# `.github/scripts/` is: it needs five competitor crates as dependencies, and
# none of them belong in splintr's own dependency graph or lockfile. It is not
# a workspace member for the same reason.
#
# `tokenizers` enables serde_json's `preserve_order`, and cargo features are
# additive per build — so serde_json's `Map` becomes an `IndexMap` for
# *everything* compiled here, splintr included. That is fine for comparing
# engines against each other, but it means this crate must never be used to
# measure splintr's own load path in absolute terms; it would be measuring a
# serde_json splintr never ships with.
[package]
name = "rust-bench"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
splintr = { path = "../.." }
# The Rust tokenizer crates, compared against each other rather than each
# against splintr alone — every engine is a column in every table it can load.
#
# `gigatoken` is absent and cannot be added. It publishes no crate, and while
# its repository does build a `lib` target, its manifest declares the unstable
# `cargo-features = ["profile-rustflags"]`, which cargo only honours from a
# workspace root — so it fails to resolve as a dependency on stable *and* on
# nightly. Building it from git the way this workflow builds splintr was tried
# and does not work. Stripping the feature out of a vendored copy would silence
# the error by discarding the build flags they chose, which would measure a
# gigatoken they do not ship; it stays in the Python suite, where its own wheel
# is what runs.
#
# `tiktoken-rs` and `bpe-openai` were here and are not any more. Both read only
# the OpenAI rank files: `bpe-openai` has no loader at all and carries cl100k
# and o200k compiled in, and `tiktoken-rs` builds from any rank file and then
# panics encoding with the ones whose bytes it cannot all look up (Tekken,
# Whisper). Across the manifest that made them two mostly-empty columns.
# `tokie` and `kitoken` replace them: both claim the whole model set rather
# than the OpenAI corner of it, so they can be held to the reference on every
# row instead of the easy ones.
tokenizers = "0.23"
riptoken = "0.3"
kitoken = "0.11"
tokie = { version = "0.1", default-features = false }
basetenkenizer = "0.2"
rayon = "1"
rustc-hash = "2"

[profile.release]
opt-level = 3
lto = true
