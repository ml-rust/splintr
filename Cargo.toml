# The vocabulary payloads live in `crates/`, one published crate per family,
# rather than in this package. This is the only place that reasoning is
# written down; the data crates themselves are a doc line and an
# `include_bytes!` each.
#
# Why not here: they total 9.13 MB compressed and this package was 9.14 MB, of
# which 0.53 MB was code. Every consumer paid for every vocabulary, and 0.18.0
# sat under a 10 MB crates.io ceiling with no room to bundle another family —
# 0.16.0 was already refused once at 10.1 MB.
#
# Why per family rather than one `splintr-vocabs`: one crate holding all of
# them ships at 9.13 MB, which leaves the same problem — no room for the next
# family — and still makes someone who wants cl100k download all of them. Per
# family, cl100k costs 0.68 MB, every family has room to grow, and a new one is
# a new crate rather than a squeeze.
#
# Each ships the `.tiktoken` text it was given and packs it into the binary form
# the loader reads in its build script, so nothing here or there is an opaque
# committed blob, and the two forms cannot disagree.
#
# These payloads never change: a vocabulary is a fixed artifact of a released
# model. Expect to publish each once.
[workspace]
members = ["crates/*"]
# Crates that live in this directory tree but are not part of the release.
# Cargo claims every manifest under a workspace root unless told otherwise, so
# without this the perf harness fails to build at all ("not a member ... and is
# not excluded") and `research/` — a vendored reference copy — would be built,
# packaged and linted alongside splintr's own code.
exclude = [".github/rust-bench", "research"]

[package]
name = "splintr"
version = "0.19.1"
edition = "2021"
description = "Fast Rust tokenizer (BPE + SentencePiece + WordPiece) with Python bindings"
license = "MIT"
repository = "https://github.com/ml-rust/splintr"
homepage = "https://github.com/ml-rust/splintr"
readme = "README.md"
keywords = ["tokenizer", "bpe", "sentencepiece", "wordpiece", "llm"]
categories = ["text-processing", "encoding"]
# Everything shipped to crates.io, listed explicitly rather than left to
# "whatever is not gitignored". No vocabulary payload is here — each family is
# its own `splintr-vocab-*` crate, pulled in only by the feature that needs it,
# which is what keeps this package a few hundred KB. `tests/` and `examples/` are
# carried too so a vendored copy stays verifiable. The Python packaging tree,
# benchmarks, scripts and docs are not the crate's business and stay out.
# `benches/` is the exception among those: it is declared as a `[[bench]]`
# target below, so a package without it fails to verify.
# Paths are anchored with a leading `/`: these are gitignore-style globs, so a
# bare `README.md` matches that name at ANY depth and would drag in a vendored
# third party's README and LICENSE from `research/`.
include = [
    "/src/**/*.rs",
    "/tests/**/*.rs",
    "/examples/**/*.rs",
    "/benches/**/*.rs",
    "/Cargo.toml",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
    "/LICENSE-OTHERS",
]

[lib]
name = "splintr"
crate-type = ["cdylib", "rlib"]

[features]
# No bundled vocabulary by default: a consumer loading their own
# `tokenizer.json`/GGUF should not download one. Opt in with `vocabs`, or the
# `vocab-*` families needed; `from_pretrained` still compiles either way and
# names the missing feature.
default = ["rayon", "regexr-jit"]
# A Python user cannot enable a cargo feature, so the wheel carries the whole
# set. Declared here rather than in `[tool.maturin] features` so it survives
# `maturin develop --features python,pcre2`, which replaces that list.
python = ["dep:pyo3", "vocabs"]
pcre2 = ["dep:pcre2"]
rayon = ["dep:rayon"]
regexr-jit = ["regexr/jit", "regexr/simd"]
# Every bundled vocabulary at once.
vocabs = [
    "vocab-cl100k",
    "vocab-o200k",
    "vocab-gpt-oss",
    "vocab-phi4",
    "vocab-olmo2",
    "vocab-llama3",
    "vocab-llama2",
    "vocab-deepseek",
    "vocab-qwen",
    "vocab-glm",
    "vocab-gemma2",
    "vocab-gemma3",
    "vocab-gemma4",
    "vocab-kimi",
    "vocab-mistral",
    "vocab-modernbert",
    "vocab-whisper",
]

# One feature per bundled vocabulary family, each pulling in that family's data
# crate. The gate is on the payload only — `PretrainedVocab` and every metadata
# accessor (eos id, base vocabulary size, pre-tokenizer pattern) stay present,
# so a build without a family still answers questions about it and
# `from_pretrained` reports which feature is missing instead of "unknown
# vocabulary".
vocab-cl100k = ["dep:splintr-vocab-cl100k"]
vocab-o200k = ["dep:splintr-vocab-o200k"]
vocab-llama3 = ["dep:splintr-vocab-llama3"]
vocab-llama2 = ["dep:splintr-vocab-llama2"]
vocab-deepseek = ["dep:splintr-vocab-deepseek"]
vocab-qwen = ["dep:splintr-vocab-qwen"]
vocab-glm = ["dep:splintr-vocab-glm"]
vocab-gemma2 = ["dep:splintr-vocab-gemma2"]
vocab-gemma3 = ["dep:splintr-vocab-gemma3"]
vocab-gemma4 = ["dep:splintr-vocab-gemma4"]
vocab-kimi = ["dep:splintr-vocab-kimi"]
vocab-mistral = ["dep:splintr-vocab-mistral"]
vocab-modernbert = ["dep:splintr-vocab-modernbert"]
vocab-whisper = ["dep:splintr-vocab-whisper"]
# Three families that ship no payload of their own. gpt-oss states o200k_base's
# ranks; Phi-4 and OLMo-2 state cl100k_base's, all 100,256 of them, verified
# rank-for-rank. What differs is the special block above the ranks and — for
# Phi-4 and OLMo-2 — the pre-tokenizer, which is Llama 3's rather than
# cl100k's. So each is its own vocabulary and its own feature, costing nothing
# beyond the family it shares data with.
vocab-gpt-oss = ["vocab-o200k"]
vocab-phi4 = ["vocab-cl100k"]
vocab-olmo2 = ["vocab-cl100k"]

[dependencies]
# One vocabulary family each, enabled by the matching `vocab-*` feature. Both a
# `path` and a `version`: the path is what the workspace builds against, and the
# version is what `cargo publish` rewrites the dependency to, so a released
# splintr resolves them from crates.io.
#
# Versioned `1` and independently of splintr, because the contents are fixed —
# a vocabulary is an artifact of a released model. Bumping them in step would
# mean republishing nine identical payloads on every splintr release.
splintr-vocab-cl100k = { path = "crates/vocab-cl100k", version = "1", optional = true }
splintr-vocab-o200k = { path = "crates/vocab-o200k", version = "1", optional = true }
splintr-vocab-llama3 = { path = "crates/vocab-llama3", version = "1", optional = true }
splintr-vocab-llama2 = { path = "crates/vocab-llama2", version = "1", optional = true }
splintr-vocab-deepseek = { path = "crates/vocab-deepseek", version = "1", optional = true }
splintr-vocab-qwen = { path = "crates/vocab-qwen", version = "1", optional = true }
splintr-vocab-glm = { path = "crates/vocab-glm", version = "1", optional = true }
splintr-vocab-gemma2 = { path = "crates/vocab-gemma2", version = "1", optional = true }
splintr-vocab-gemma3 = { path = "crates/vocab-gemma3", version = "1", optional = true }
splintr-vocab-gemma4 = { path = "crates/vocab-gemma4", version = "1", optional = true }
splintr-vocab-kimi = { path = "crates/vocab-kimi", version = "1", optional = true }
splintr-vocab-mistral = { path = "crates/vocab-mistral", version = "1", optional = true }
splintr-vocab-modernbert = { path = "crates/vocab-modernbert", version = "1", optional = true }
splintr-vocab-whisper = { path = "crates/vocab-whisper", version = "1", optional = true }

# PCRE2 regex with JIT support (optional, for benchmarking)
pcre2 = { version = "0.2", optional = true }
# Rayon for internal parallelism
rayon = { version = "1.10", optional = true }
# Fast hashing (FxHashMap)
rustc-hash = "2.0"
# Error handling
thiserror = "2.0"
# Python bindings
# `abi3-py310` builds against the stable ABI, so ONE wheel per platform serves
# every CPython from 3.10 up — the `requires-python` floor in pyproject.toml.
# Without it maturin builds for whichever single interpreter the build host
# happens to have (3.9 in the manylinux container, 3.12 on the macOS and
# Windows runners), and every other version silently compiles the sdist.
#
# The floor is 3.10 rather than 3.8 because the limited API gets materially
# cheaper there: measured over 1000 short encodes, a `py38` build spends 9.8%
# longer than a `py310` one on identical code, and `py312` adds nothing
# further. The cost is dropping two interpreters that reached end of life in
# October 2024 and October 2025.
pyo3 = { version = "0.29", features = [
    "extension-module",
    "abi3-py310",
], optional = true }
# Base64 decoding for tiktoken vocab files
base64 = "0.22"
# Aho-Corasick for fast multi-pattern special token matching
aho-corasick = "1.1"
memchr = "2.7"
# LRU cache for frequent token sequences
lru = "0.18"
# regexr regex engine (default backend)
regexr = { version = "0.3.2", default-features = false }
# Unicode normalization for WordPiece accent stripping
unicode-normalization = "0.1"
# Grapheme clustering for `CharsmapDialect::HuggingFace`. Same crate
# `spm_precompiled` uses, so the cluster boundaries are the reference's own.
unicode-segmentation = "1"
# Unicode general category for punctuation detection
unicode-general-category = "1.0"
# JSON parsing for HuggingFace tokenizer.json loader (Whisper)
serde = "1.0"
# `raw_value` lets the loader record `model.vocab` as an unparsed span instead
# of materializing a 100k-200k entry `Value` map — see `hf_json::loader`.
serde_json = { version = "1.0", features = ["raw_value"] }

[dev-dependencies]
# splintr on itself: Cargo has no dev-only feature, and this is how `vocabs`
# gets switched on for test and bench builds without a consumer's `cargo build`
# picking it up. Without it every vocabulary-loading unit test would need a
# `#[cfg]` gate and `cargo test` would silently skip them.
splintr = { path = ".", features = ["vocabs"] }
# Property-based testing: the BPE merge loop is checked against a slow,
# obviously-correct reference implementation over generated inputs.
proptest = "1"
# Encode-path benchmarks. `tests/encode_cost.rs` guards the shapes a
# performance regression takes; `benches/encode.rs` measures the constants it
# deliberately does not.
fluxbench = "0.1"

[[bench]]
name = "encode"
harness = false
# `harness = false` means the file must produce a `main`, so it cannot gate
# itself out with `#![cfg]` the way the integration tests do.
required-features = ["vocab-llama3"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
