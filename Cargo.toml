[package]
name = "splintr"
version = "0.14.4"
edition = "2021"
description = "Fast Rust tokenizer (BPE + SentencePiece + WordPiece) with Python bindings"
license = "MIT"
repository = "https://github.com/ml-rust/splintr"
homepage = "https://github.com/ml-rust/splintr"
readme = "README.md"
keywords = ["tokenizer", "bpe", "sentencepiece", "wordpiece", "llm"]
categories = ["text-processing", "encoding"]
# Everything shipped to crates.io, listed explicitly rather than left to
# "whatever is not gitignored". `vocabs/` is mandatory: `src/core/pretrained.rs`
# embeds those files with `include_bytes!`, so a published crate missing them
# fails to compile on the consumer's machine. `tests/` and `examples/` are
# carried too (184 KB against a 15 MB payload) so a vendored copy stays
# verifiable. The Python packaging tree, benchmarks, scripts and docs are not
# the crate's business and stay out. `benches/` is the exception among those: it
# is declared as a `[[bench]]` target below, so a package without it fails to
# verify.
# Paths are anchored with a leading `/`: these are gitignore-style globs, so a
# bare `README.md` matches that name at ANY depth and would drag in a vendored
# third party's README and LICENSE from `research/`.
include = [
    "/src/**/*.rs",
    "/tests/**/*.rs",
    "/examples/**/*.rs",
    "/benches/**/*.rs",
    "/vocabs/*.tiktoken",
    "/vocabs/*.spm",
    "/Cargo.toml",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
]

[lib]
name = "splintr"
crate-type = ["cdylib", "rlib"]

[features]
default = ["rayon", "regexr-jit"]
python = ["dep:pyo3"]
pcre2 = ["dep:pcre2"]
rayon = ["dep:rayon"]
regexr-jit = ["regexr/jit", "regexr/simd"]

[dependencies]
# PCRE2 regex with JIT support (optional, for benchmarking)
pcre2 = { version = "0.2", optional = true }
# Rayon for internal parallelism
rayon = { version = "1.10", optional = true }
# Fast hashing (FxHashMap)
rustc-hash = "2.0"
# Error handling
thiserror = "2.0"
# Python bindings
# `abi3-py38` builds against the stable ABI, so ONE wheel per platform serves
# every CPython from 3.8 up — the `requires-python` floor in pyproject.toml.
# Without it maturin builds for whichever single interpreter the build host
# happens to have (3.9 in the manylinux container, 3.12 on the macOS and
# Windows runners), and every other version silently compiles the sdist.
pyo3 = { version = "0.29", features = [
    "extension-module",
    "abi3-py38",
], optional = true }
# Base64 decoding for tiktoken vocab files
base64 = "0.22"
# Aho-Corasick for fast multi-pattern special token matching
aho-corasick = "1.1"
# LRU cache for frequent token sequences
lru = "0.18"
# regexr regex engine (default backend)
regexr = { version = "0.3.1", default-features = false }
# Unicode normalization for WordPiece accent stripping
unicode-normalization = "0.1"
# Unicode general category for punctuation detection
unicode-general-category = "1.0"
# JSON parsing for HuggingFace tokenizer.json loader (Whisper)
serde_json = "1.0"

[dev-dependencies]
# Property-based testing: the BPE merge loop is checked against a slow,
# obviously-correct reference implementation over generated inputs.
proptest = "1"
# Encode-path benchmarks. `tests/encode_cost.rs` guards the shapes a
# performance regression takes; `benches/encode.rs` measures the constants it
# deliberately does not.
fluxbench = "0.1"

[[bench]]
name = "encode"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
