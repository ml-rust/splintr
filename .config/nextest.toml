# nextest configuration.
#
# The suite is CPU-bound and hermetic — every test builds its tokenizer from
# embedded vocabularies or a fixture file, touches no shared state, and needs no
# network — so everything runs at full parallelism, with the one exception below.

[profile.default]
test-threads = "num-cpus"
# A failing case in one vocabulary says nothing about the others, and the useful
# CI artifact is the full list of what broke, not the first thing that did.
fail-fast = false
# Slow is normal for the reference-corpus tests; only report, never kill.
slow-timeout = { period = "60s", terminate-after = 10 }

# Machine-readable results for the CI artifact. Written to
# target/nextest/<profile>/junit.xml.
[profile.default.junit]
path = "junit.xml"

# The two tests that assert on wall-clock rather than on output: one on parallel
# speedup, one on the growth curve of encode time against input length.
#
# nextest runs a process per test, so by default these race every other test in
# the suite for the very cores they are measuring — which is enough on its own to
# push the observed speedup under its threshold, and has already produced three
# false failures (a release run, a pre-commit hook, a local run). Reserving every
# runner slot gives each the machine to itself, which is the condition both
# assume.
#
# The retry is for the contention nextest cannot see: anything else on the
# machine. A timing assertion that holds on a quiet run and fails on a busy one
# is reporting the load, not the code — and a real regression fails all three
# attempts, so nothing is hidden.
[[profile.default.overrides]]
filter = 'test(=batch_encoding_scales_with_available_cores) or test(=unsplit_input_encodes_sub_quadratically)'
threads-required = "num-cpus"
retries = 2
