# nextest configuration.
#
# The suite is CPU-bound and hermetic — every test builds its tokenizer from
# embedded vocabularies or a fixture file, touches no shared state, and needs no
# network — so everything runs at full parallelism, with the one exception below.

[profile.default]
test-threads = "num-cpus"
# A failing case in one vocabulary says nothing about the others, and the useful
# CI artifact is the full list of what broke, not the first thing that did.
fail-fast = false
# Slow is normal for the reference-corpus tests; only report, never kill.
slow-timeout = { period = "60s", terminate-after = 10 }

# Machine-readable results for the CI artifact. Written to
# target/nextest/<profile>/junit.xml.
[profile.default.junit]
path = "junit.xml"

# The one test that asserts on wall-clock parallel speedup rather than on output.
# nextest runs a process per test, so by default this one races every other test
# in the suite for the very cores whose use it is measuring — on a small runner
# that alone can push the observed speedup under the threshold. Reserving every
# runner slot gives it the machine to itself, which is the condition it assumes.
[[profile.default.overrides]]
filter = 'test(=batch_encoding_scales_with_available_cores)'
threads-required = "num-cpus"
